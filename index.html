
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy trang</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #0f172a, #1e293b);
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .code {
            font-size: 150px;
            font-weight: bold;
            color: #38bdf8;
            margin: 0;
        }

        h1 {
            font-size: 32px;
            margin: 20px 0;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            background: #38bdf8;
            color: #082f49;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        a:hover {
            background: #7dd3fc;
        }
    </style>
</head>

<body>

    <div class="container">

        <p class="code">404</p>

        <h1>Không tìm thấy trang!</h1>

        <p>
            Xin lỗi, trang bạn đang tìm kiếm không tồn tại,
            đã được di chuyển hoặc đường dẫn không chính xác.
        </p>

        <a href="/">Quay về trang chủ</a>

    </div>

</body>
</html>
